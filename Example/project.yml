name: ShipKitDemo
options:
  bundleIdPrefix: dev.shipkit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ShipKit:
    path: ..
targets:
  ShipKitDemo:
    type: application
    platform: iOS
    sources:
      - ShipKitDemo
    dependencies:
      - package: ShipKit
        product: ShipKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shipkit.demo
        PRODUCT_NAME: ShipKitDemo
        MARKETING_VERSION: "2.4.0"
        CURRENT_PROJECT_VERSION: "311"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: ShipKitDemo/ShipKitDemo.entitlements
      properties:
        aps-environment: development
    info:
      path: ShipKitDemo/Info.plist
      properties:
        CFBundleDisplayName: ShipKit Demo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  ShipKitDemo:
    build:
      targets:
        ShipKitDemo: all
    run:
      config: Debug
      environmentVariables:
        SHIPKIT_API_URL: http://localhost:8787
        SHIPKIT_CLIENT_KEY: skc_demo
      commandLineArguments:
        "-ShipKitSimulateVersion 1.0.0": false
